<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Preview</title>
<style>

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                line-height: 1.6;
                color: #333;
                background-color: #f5f5f5;
                margin: 0;
                padding: 20px;
            }
            
            .docx-preview-container {
                max-width: 800px;
                margin: 0 auto;
                background: white;
                padding: 40px;
                box-shadow: 0 0 20px rgba(0,0,0,0.1);
                border-radius: 8px;
            }
            
            .title {
                font-size: 2em;
                font-weight: bold;
                text-align: center;
                margin-bottom: 1em;
                color: #2c3e50;
                border-bottom: 3px solid #3498db;
                padding-bottom: 10px;
            }
            
            .subtitle {
                font-size: 1.3em;
                font-weight: 600;
                text-align: center;
                margin-bottom: 1.5em;
                color: #7f8c8d;
            }
            
            .heading-1 {
                font-size: 1.8em;
                color: #2c3e50;
                margin-top: 1.5em;
                margin-bottom: 0.8em;
                border-bottom: 2px solid #ecf0f1;
                padding-bottom: 5px;
            }
            
            .heading-2 {
                font-size: 1.5em;
                color: #34495e;
                margin-top: 1.3em;
                margin-bottom: 0.7em;
            }
            
            .heading-3 {
                font-size: 1.3em;
                color: #34495e;
                margin-top: 1.1em;
                margin-bottom: 0.6em;
            }
            
            .paragraph {
                margin-bottom: 1em;
                text-align: justify;
            }
            
            .docx-table {
                width: 100%;
                border-collapse: collapse;
                margin: 1.5em 0;
                background: white;
            }
            
            .table-cell {
                border: 1px solid #ddd;
                padding: 12px;
                text-align: left;
            }
            
            .docx-table th {
                background-color: #f8f9fa;
                font-weight: 600;
                color: #2c3e50;
            }
            
            .docx-table tr:nth-child(even) {
                background-color: #f8f9fa;
            }
            
            strong {
                color: #2c3e50;
            }
            
            em {
                color: #7f8c8d;
            }
            
            @media print {
                body {
                    background: white;
                    padding: 0;
                }
                
                .docx-preview-container {
                    box-shadow: none;
                    padding: 20px;
                }
            }
            
            @media (max-width: 768px) {
                .docx-preview-container {
                    padding: 20px;
                    margin: 10px;
                }
                
                .title {
                    font-size: 1.5em;
                }
                
                .docx-table {
                    font-size: 0.9em;
                }
                
                .table-cell {
                    padding: 8px;
                }
            }
        
</style>
</head>
<body>
<div class="docx-preview-container">
<p class="title">Test Report - Phase 3 Enhancement</p>
<h1 class="heading-1">1. Program Information</h1>
<p class="paragraph">This is a test document to verify python-docx functionality.</p>
<table class="docx-table">
<tr>
<th class="table-cell">Field</th>
<th class="table-cell">Value</th>
</tr>
<tr>
<td class="table-cell">Date</td>
<td class="table-cell">10/08/2025</td>
</tr>
<tr>
<td class="table-cell">Status</td>
<td class="table-cell">Test Successful</td>
</tr>
</table>
</div>
</body>
</html>
