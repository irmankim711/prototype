<!DOCTYPE html>
<html>
<head>
    <title>Test Google Forms Status</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        pre {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #dcdcaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Google Forms Status Test</h1>

        <div>
            <button onclick="testStatus('http://localhost:5000')">Test Localhost</button>
            <button onclick="testStatus('https://backend-test-6a78.up.railway.app')">Test Production</button>
        </div>

        <h2>Your Firebase Token:</h2>
        <textarea id="token" rows="10" style="width: 100%; font-family: monospace;">
Paste your Firebase token here (from browser DevTools → Application → Local Storage → firebase:authUser)
        </textarea>

        <div id="result"></div>
    </div>

    <script>
        async function testStatus(baseUrl) {
            const token = document.getElementById('token').value.trim();
            const resultDiv = document.getElementById('result');

            if (!token || token.includes('Paste your')) {
                resultDiv.innerHTML = '<pre class="error">❌ Please paste your Firebase token first!</pre>';
                return;
            }

            resultDiv.innerHTML = '<pre>⏳ Testing ' + baseUrl + '...</pre>';

            try {
                const response = await fetch(baseUrl + '/api/google-forms/status', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                let html = '<h2>Status Response from ' + baseUrl + ':</h2>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

                html += '<h3>Interpretation:</h3><pre>';
                if (data.is_authorized) {
                    html += '<span class="success">✅ You ARE authorized for Google Forms</span>\n';
                    html += '   Frontend should show: Forms list\n';
                    html += '   Forms count: ' + (data.forms_count || 0);
                } else {
                    html += '<span class="error">❌ You are NOT authorized for Google Forms</span>\n';
                    html += '   Frontend should show: "Sign in with Google" button\n';
                    html += '   Action: Click "Sign in with Google" to authorize';
                }
                html += '</pre>';

                resultDiv.innerHTML = html;

            } catch (error) {
                resultDiv.innerHTML = '<pre class="error">❌ Error: ' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
